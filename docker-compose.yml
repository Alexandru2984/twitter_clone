version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: twitter_clone_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=twitter_clone

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: twitter_clone_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mongodb
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DB_NAME=twitter_clone
      - JWT_SECRET=your-secret-key-change-in-production
      - PORT=8080

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: twitter_clone_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
